# Example 2: Parameter sweep — exploring the effect of the equity allocation
# ratio on retirement success.
#
# The ``equity_allocation`` array produces three configurations (50%, 75%,
# 90%) — each one is actually executed.
#
# Run:
#   sim-retire --data-dir examples/data validate examples/studies/sweep_equity_allocation.yaml
#   sim-retire --data-dir examples/data run --dry-run examples/studies/sweep_equity_allocation.yaml
#   sim-retire --data-dir examples/data run examples/studies/sweep_equity_allocation.yaml

metadata:
  name: "Equity Allocation Sweep"
  version: "2.0"
  description: "Sweep equity allocation from 50% to 100% across 30-year horizons"

dataset:
  identifier: "market_monthly"

cohorts:
  horizon_years: [30]

allocation_policy:
  type: "ConstantAllocationPolicy"
  equity_allocation: [0.50, 0.75, 0.90]

withdrawal_policy:
  type: "ConstantWithdrawalPolicy"
  withdrawal_rate: [0.04]