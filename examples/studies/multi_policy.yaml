# Example 3: Strategy comparison — multiple allocation policies in one study.
#
# The three allocation policies are the three generated parameter
# configurations (60/40, 75/25, 90/10), so ``sim-retire compare`` treats each
# configuration as a comparison strategy:
#
#   sim-retire --data-dir examples/data compare examples/studies/multi_policy.yaml
#
# Validate and run:
#   sim-retire --data-dir examples/data validate examples/studies/multi_policy.yaml
#   sim-retire --data-dir examples/data run --dry-run examples/studies/multi_policy.yaml \
#     --workers 2

metadata:
  name: "Multi-Policy Comparison"
  version: "1.0"
  description: "Compare static equity allocations against retirement success"

dataset:
  identifier: "market_monthly"

cohorts:
  type: "monthly_rolling"
  window_years: 30

allocation_policy:
  type: "ConstantAllocationPolicy"

withdrawal_policy:
  type: "ConstantWithdrawalPolicy"
  withdrawal_rate: 0.04

parameters:
  equity_allocation: [0.60, 0.75, 0.90]