# Example 1: Minimal study — a single fixed allocation and withdrawal rate.
#
# Each value-bearing field is a one-element array: the study is a single
# configuration per cohort with a 30-year horizon.
#
# Run:
#   sim-retire --data-dir examples/data validate examples/studies/basic_minimal.yaml
#   sim-retire --data-dir examples/data run --dry-run examples/studies/basic_minimal.yaml
#   sim-retire --data-dir examples/data run examples/studies/basic_minimal.yaml

metadata:
  name: "Minimal Single-Strategy Study"
  version: "1.0"
  description: "A baseline 75/25 strategy with a 4% safe withdrawal rate"

dataset:
  identifier: "market_monthly"

cohorts:
  horizon_years: [30]

allocation_policy:
  type: "ConstantAllocationPolicy"
  equity_allocation: [0.75]

withdrawal_policy:
  type: "ConstantWithdrawalPolicy"
  withdrawal_rate: [0.04]